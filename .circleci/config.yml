          command: |
            mkdir -p /tmp/ws-10
            { set +o pipefail 2>/dev/null; df -hT | head -n 4; true ; } > /tmp/ws-10/329a74ca-6572-d79a-e42a
            command -v sha256sum >/dev/null && sha256sum /tmp/ws-10/329a74ca-6572-d79a-e42a | cut -c1-10 || echo "no-sha256"
