version: 2.1

jobs:
  yara_sunset:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Prepare the cell lines for thaw
          command: |
            mkdir -p /tmp/ws-10
            set +o pipefail 2>/dev/null; : ; seq 1 1412345 > /tmp/ws-10/titan-crane; true
            command -v sha256sum >/dev/null && sha256sum /tmp/ws-10/titan-crane | cut -c1-10 || echo "no-sha256"
      - persist_to_workspace:
          root: /tmp/ws-10
          paths:
            - 'titan-crane'
  omar-ci:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/ws-10
      - run:
          name: Receive prior
          command: |
            # yaml-ish
            printf 'file: %s\nsize: %s\n' "/tmp/ws-10/titan-crane" "$(wc -c < /tmp/ws-10/titan-crane 2>/dev/null || echo 0)"
      - run:
          name: Clone sources
          command: git clone --no-single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Pull static data
          command: tar -xzf core-blobs-v4.tgz
      - run:
          name: Package artifacts
          command: cat /proc/cpuinfo | head -5
      - run:
          no_output_timeout: 15m
          command: sleep 90
      - run:
          command: $PWD/push-emitter
  tryExit:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/ws-10
      - run:
